AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  TrainingGPT MVP backend — single-table DynamoDB + single Lambda behind a
  Function URL. No API Gateway. On-demand DynamoDB billing. Designed for $0
  monthly cost at low/personal traffic volumes.

Globals:
  Function:
    Runtime: python3.11
    Timeout: 10
    MemorySize: 128
    Architectures:
      - arm64

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: training-gpt-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      LambdaConfig:
        PreSignUp: !GetAtt InviteCodeValidatorFunction.Arn

  InviteCodeValidatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: training-invite-code-validator
      CodeUri: src/
      Handler: invite_trigger.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref TrainingLogsTable
      # Separate least-privilege role from the main API function: this one
      # only ever consumes invite codes / claims usernames, never touches
      # training log items. Both actions are needed because the two checks
      # run together in one TransactWriteItems call (Update + Put) — IAM
      # authorizes a transaction per the underlying action of each item.
      Policies:
        - Statement:
            - Sid: InviteCodeAndUsernameClaim
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:PutItem
              Resource: !GetAtt TrainingLogsTable.Arn

  InviteCodeValidatorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${InviteCodeValidatorFunction}
      RetentionInDays: 14

  InviteCodeValidatorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref InviteCodeValidatorFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: training-gpt-frontend
      UserPoolId: !Ref UserPool
      GenerateSecret: false # public client (browser JS can't keep a secret)
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours

  TrainingLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TrainingLogs
      BillingMode: PAY_PER_REQUEST # on-demand capacity -> $0 when idle
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  TrainingLogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: training-logs-handler
      CodeUri: src/
      Handler: app.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref TrainingLogsTable
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      # Least-privilege: only the two operations the handler actually uses,
      # scoped to this single table (no wildcard resources/actions).
      Policies:
        - Statement:
            - Sid: TrainingLogsReadWrite
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt TrainingLogsTable.Arn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
          AllowMethods:
            - GET
            - POST
            - PUT
          AllowHeaders:
            - content-type
            - authorization
          MaxAge: 300

  TrainingLogsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TrainingLogsFunction}
      RetentionInDays: 14 # avoid unbounded log storage growth (would otherwise never expire)

Outputs:
  FunctionUrl:
    Description: Public HTTPS endpoint for the training log API (no API Gateway).
    Value: !GetAtt TrainingLogsFunctionUrl.FunctionUrl
  TableName:
    Description: DynamoDB table name.
    Value: !Ref TrainingLogsTable
  TableArn:
    Description: DynamoDB table ARN.
    Value: !GetAtt TrainingLogsTable.Arn
  UserPoolId:
    Description: Cognito User Pool ID — needed by the frontend for sign-up/sign-in.
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID — needed by the frontend for sign-up/sign-in.
    Value: !Ref UserPoolClient
